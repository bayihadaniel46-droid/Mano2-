<form action="/register" method="POST">

<input
type="text"
name="nom"
placeholder="Nom complet"
required>

<br><br>

<input
type="text"
name="metier"
placeholder="Métier"
required>

<br><br>

<input
type="text"
name="ville"
placeholder="Ville"
required>

<br><br>

<input
type="email"
name="email"
placeholder="Email"
required>

<br><br>

<input
type="password"
name="password"
placeholder="Mot de passe"
required>

<br><br>

<br><br>

<input
type="text"
name="telephone"
placeholder="Téléphone">

<br><br>

<textarea
name="description"
placeholder="Décrivez votre expérience..."
rows="4"
cols="40">
</textarea>

<button type="submit">

Créer mon compte

</button>

</form>
